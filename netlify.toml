# Netlify build config, at the repo root so the site can be deployed by pointing
# Netlify at this repository with no manual settings entered in the UI.
#
# `base` points to the citizen website subdirectory; without it
# Netlify runs npm in the root, finds no package.json, and fails the build with a
# message that does not mention directories at all.

[build]
  base = "frontend-citizen"
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Vite 8 needs a modern Node; Netlify's default image lags behind.
  NODE_VERSION = "22"
  VITE_API_BASE = "https://jansetu-api.onrender.com"
  VITE_SESSION_BASE = "/backend"

[[redirects]]
  from = "/backend/intake/session"
  to = "https://jansetu-api.onrender.com/intake/session"
  status = 200
  force = true

[[redirects]]
  from = "/backend/intake/session/revoke"
  to = "https://jansetu-api.onrender.com/intake/session/revoke"
  status = 200
  force = true

# Duplicates public/_redirects on purpose. Whichever of the two Netlify reads,
# deep links to /dashboard and /recommendations resolve instead of 404ing.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
