# Netlify build config, at the repo root so the site can be deployed by pointing
# Netlify at this repository with no manual settings entered in the UI.
#
# `base` matters: the frontend is a subdirectory of a monorepo, and without it
# Netlify runs npm in the root, finds no package.json, and fails the build with a
# message that does not mention directories at all.

[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Vite 8 needs a modern Node; Netlify's default image lags behind.
  NODE_VERSION = "22"

# Duplicates public/_redirects on purpose. Whichever of the two Netlify reads,
# deep links to /dashboard and /recommendations resolve instead of 404ing.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
